moveit_servo:
  ros__parameters:
    use_sim_time: true
    servo_planning_group: panda_arm
    ee_frame: panda_hand
    planning_frame: panda_link0
    panda_joint_tolerance: 0.01
    max_vel: 0.3
    max_accel: 0.3
    command_out_topic: /servo_node/delta_twist_cmds
    incoming_command_type: pose
    pose_topic: /servo_node/pose_target_cmds
    joint_limit_margin: 0.1
    low_pass_filter_coeff: 0.05
